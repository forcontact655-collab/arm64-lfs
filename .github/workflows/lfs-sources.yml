name: lfs-sources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-and-verify:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      LFS: /home/runner/lfs
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified source cache
        uses: actions/cache@v4
        with:
          path: /home/runner/lfs/sources
          key: lfs-12.4-sources-v1-${{ hashFiles('manifests/md5sums') }}-${{ github.run_id }}
          restore-keys: |
            lfs-12.4-sources-v1-${{ hashFiles('manifests/md5sums') }}-
          save-always: true
      - name: Download and verify official LFS sources
        shell: bash
        run: bash scripts/fetch-lfs-sources.sh
      - name: Upload source verification report
        uses: actions/upload-artifact@v4
        with:
          name: lfs-source-report
          path: |
            artifacts/source-report.txt
            artifacts/source-sha256sums.txt
            artifacts/source-skipped.txt
          retention-days: 14
