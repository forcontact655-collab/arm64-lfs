version: 2.1

jobs:
  probe-arm64:
    machine:
      image: ubuntu-2404:current
    resource_class: arm.medium
    steps:
      - checkout
      - run:
          name: Probe native ARM64 host
          command: bash scripts/probe.sh
      - store_artifacts:
          path: artifacts

  verify-lfs-checkpoint:
    machine:
      image: ubuntu-2404:current
    resource_class: arm.medium
    steps:
      - checkout
      - restore_cache:
          keys:
            - lfs-12.4-ch7-aarch64-v1-acde9ca99aa0f0714c700c71d3101f84c77e9830e80bd6c3c313a724a8cd03c1
      - run:
          name: Restore public LFS checkpoint on cache miss
          command: |
            set -euo pipefail
            if [ ! -x /home/circleci/lfs/usr/bin/gcc ]; then
              mkdir -p /home/circleci/lfs /home/circleci/checkpoints
              archive=/home/circleci/checkpoints/lfs-12.4-ch7-aarch64-rootfs.tar.xz
              curl -fL --retry 4 --retry-delay 3 \
                -o "$archive" \
                https://github.com/forcontact655-collab/arm64-lfs/releases/download/lfs-12.4-ch7-aarch64/lfs-12.4-ch7-aarch64-rootfs.tar.xz
              printf '%s  %s\n' \
                acde9ca99aa0f0714c700c71d3101f84c77e9830e80bd6c3c313a724a8cd03c1 \
                "$archive" | sha256sum -c -
              tar -xJf "$archive" -C /home/circleci/lfs --no-same-owner
              rm -f "$archive"
            fi
      - run:
          name: Compile and execute inside restored LFS
          command: bash scripts/verify-lfs-checkpoint.sh
      - save_cache:
          key: lfs-12.4-ch7-aarch64-v1-acde9ca99aa0f0714c700c71d3101f84c77e9830e80bd6c3c313a724a8cd03c1
          paths:
            - /home/circleci/lfs
      - store_artifacts:
          path: artifacts

  chapter8a:
    machine:
      image: ubuntu-2404:current
    resource_class: arm.medium
    steps:
      - checkout
      - restore_cache:
          keys:
            - lfs-12.4-ch7-aarch64-v1-acde9ca99aa0f0714c700c71d3101f84c77e9830e80bd6c3c313a724a8cd03c1
      - restore_cache:
          keys:
            - lfs-12.4-sources-v1-{{ checksum "manifests/md5sums" }}-{{ checksum "manifests/wget-list-sysv" }}
      - run:
          name: Download and verify official LFS sources
          command: |
            set -o pipefail
            mkdir -p artifacts
            LFS=/home/circleci/lfs-sources bash scripts/fetch-lfs-sources.sh 2>&1 | tee artifacts/lfs-sources-circleci.log
      - save_cache:
          key: lfs-12.4-sources-v1-{{ checksum "manifests/md5sums" }}-{{ checksum "manifests/wget-list-sysv" }}
          paths:
            - /home/circleci/lfs-sources
      - run:
          name: Build LFS chapter 8a final toolchain
          command: |
            set -o pipefail
            bash scripts/run-lfs-chapter8a.sh 2>&1 | tee artifacts/chapter8a-host.log
      - save_cache:
          key: lfs-12.4-ch8a-aarch64-v1-{{ checksum "scripts/build-lfs-chapter8a-chroot.sh" }}-{{ checksum "scripts/run-lfs-chapter8a.sh" }}
          paths:
            - /home/circleci/lfs
      - store_artifacts:
          path: artifacts

  chapter8b:
    machine:
      image: ubuntu-2404:current
    resource_class: arm.medium
    steps:
      - checkout
      - restore_cache:
          keys:
            - lfs-12.4-ch8a-aarch64-v1-{{ checksum "scripts/build-lfs-chapter8a-chroot.sh" }}-{{ checksum "scripts/run-lfs-chapter8a.sh" }}
      - restore_cache:
          keys:
            - lfs-12.4-sources-v1-{{ checksum "manifests/md5sums" }}-{{ checksum "manifests/wget-list-sysv" }}
      - run:
          name: Verify official LFS source cache
          command: |
            set -o pipefail
            mkdir -p artifacts
            LFS=/home/circleci/lfs-sources bash scripts/fetch-lfs-sources.sh 2>&1 | tee artifacts/lfs-sources-circleci.log
      - save_cache:
          key: lfs-12.4-sources-v1-{{ checksum "manifests/md5sums" }}-{{ checksum "manifests/wget-list-sysv" }}
          paths:
            - /home/circleci/lfs-sources
      - run:
          name: Build remaining LFS chapter 8 base system
          command: |
            set -o pipefail
            bash scripts/run-lfs-chapter8b.sh 2>&1 | tee artifacts/chapter8b-host.log
      - save_cache:
          key: lfs-12.4-ch8b-aarch64-v1-{{ checksum "scripts/build-lfs-chapter8b-chroot.sh" }}-{{ checksum "scripts/run-lfs-chapter8b.sh" }}
          paths:
            - /home/circleci/lfs
      - store_artifacts:
          path: artifacts

workflows:
  staged-lfs:
    jobs:
      - chapter8a
